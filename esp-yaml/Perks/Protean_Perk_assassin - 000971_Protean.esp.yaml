Description:
  TargetLanguage: English
  Value: 'While you wear a stolen face, your sneak attacks do ten times the damage against anyone who shares a faction with that face and is not hostile to you. Consume a person while nobody can see you and it goes unnoticed: no crime, the alarm their death raised is called off, and their face goes on at once at no Stamina cost. Comes with Stealth Consume: for a minute, every person you kill with a melee sneak attack is consumed at once.'
