; Protean tuning. Re-read every time you transform, so you can edit this while the game runs.
[Camera]
; multiplies the per-animal camera height from the creature table
HeightScale=1.3
; engine over-the-shoulder offset: 30 = right shoulder, 0 = centred, negative = left
ShoulderX=0
ShoulderZ=0
; our camera point in the animal's own space: sideways (+ = right) and forward/back (+ = forward)
SideOffset=0
BackOffset=0
; starting camera distance (0 = closest); the mouse wheel still works
Zoom=0.35

[Dev]
; DEVELOPMENT ONLY. 1 = watch Protean.cmd for test commands (see src/Dev.h). Set to 0 for release.
Commands=1
