; Protean tuning. Re-read every time you transform, so you can edit this while the game runs.
[Camera]
; AutoHeight=1 measures the animal's loaded model (works for any creature, modded too); 0 uses the table's value
AutoHeight=1
; camera height = model centre + TopFactor * model radius, then multiplied by HeightScale
TopFactor=0.9
HeightScale=1.0
; engine over-the-shoulder offset: 30 = right shoulder, 0 = centred, negative = left
ShoulderX=0
ShoulderZ=0
; our camera point in the animal's own space: sideways (+ = right) and forward/back (+ = forward)
SideOffset=0
BackOffset=0
; starting camera distance (0 = closest); the mouse wheel still works
Zoom=0.35

[Dev]
; DEVELOPMENT ONLY. 1 = watch Protean.cmd for test commands (see src/Dev.h). Set to 0 for release.
Commands=1

[Attacks]
; 1 = the attack buttons fire the animal's own attacks: LMB = first normal attack, RMB = second, hold = power attack
Translate=1

[Face]
; Face stealing. JoinFactions=1: wearing a face puts you in that person's factions.
Enabled=1
JoinFactions=1
WitnessRange=3000
